[project]
name = "wind-api"
version = "0.1.0"
description = "Wind day-ahead decision API: Elexon WINDFOR forecasts scored against FUELHH actuals"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ANN", "S", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["main.py", "wind", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: calls the real Elexon API over the internet (part of make check by choice)",
]
