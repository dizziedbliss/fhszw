# Local development: `make dev` (docker compose --profile dev up).
# Source is bind-mounted for hot reload; dependencies live in named volumes
# so the container's Linux packages never mix with the host's.
services:
  api-dev:
    profiles: [dev]
    image: ghcr.io/astral-sh/uv:0.13.5-python3.14-trixie-slim
    working_dir: /app
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
    command: sh -c "uv sync --frozen && uv run --frozen fastapi dev --host 0.0.0.0 --port 8000"
    volumes:
      - ./apps/api:/app
      - api-venv:/venv
    ports:
      - "8000:8000"

  web-dev:
    profiles: [dev]
    image: node:24.22.1-alpine
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://api-dev:8000
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api-dev

volumes:
  api-venv:
  web-node-modules:
