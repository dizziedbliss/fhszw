# Two profiles:
#   dev  (`make dev`):   hot reload. Source is bind-mounted; dependencies live in named
#                        volumes so the container's Linux packages never mix with the host's.
#   prod (`make smoke`): the production images, web on http://localhost:8080.
services:
  api-dev:
    profiles: [dev]
    image: ghcr.io/astral-sh/uv:0.13.5-python3.14-trixie-slim
    working_dir: /app
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
    command: sh -c "uv sync --frozen && uv run --frozen fastapi dev --host 0.0.0.0 --port 8000"
    volumes:
      - ./apps/api:/app
      - api-venv:/venv
    ports:
      - "8000:8000"

  web-dev:
    profiles: [dev]
    image: node:24.22.1-alpine
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://api-dev:8000
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api-dev

  api:
    profiles: [prod]
    build: ./apps/api
    # Liveness only: /api/health calls Elexon, and an Elexon hiccup shouldn't mark us dead.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  web:
    profiles: [prod]
    build: ./apps/web
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  api-venv:
  web-node-modules:
